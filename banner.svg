<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="sirocco.gallery — autunno 2026">
  <title>sirocco.gallery</title>
  <defs>

    <!--
      Kinetic turbulence — same visual language as the landing page.
      Warm umber darks, compressed mass, directional force.
    -->
    <filter id="kb" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="linearRGB">
      <feTurbulence
        type="turbulence"
        baseFrequency="0.006 0.011"
        numOctaves="7"
        seed="5"
        result="noise">
        <animate
          attributeName="baseFrequency"
          values="0.006 0.011;0.008 0.014;0.006 0.010;0.006 0.011"
          dur="20s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
      </feTurbulence>
      <feColorMatrix
        type="matrix"
        values="
          0.30  0.14  0.04  0  0.04
          0.15  0.07  0.02  0  0.02
          0.04  0.02  0.01  0  0.01
          0     0     0     5 -1.6"/>
    </filter>

    <!-- Second turbulence pass — layered depth -->
    <filter id="kb2" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="linearRGB">
      <feTurbulence
        type="turbulence"
        baseFrequency="0.010 0.020"
        numOctaves="5"
        seed="11"
        result="noise2">
        <animate
          attributeName="baseFrequency"
          values="0.010 0.020;0.013 0.022;0.010 0.020"
          dur="14s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </feTurbulence>
      <feColorMatrix
        type="matrix"
        values="
          0.22  0.10  0.03  0  0.05
          0.10  0.05  0.01  0  0.02
          0.03  0.01  0     0  0.01
          0     0     0     4 -1.2"/>
    </filter>

    <!-- Directional force mass from above -->
    <radialGradient id="fg" cx="50%" cy="-5%" r="80%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#5e2e12"/>
      <stop offset="30%"  stop-color="#3d1c08" stop-opacity="0.9"/>
      <stop offset="70%"  stop-color="#1a0c04" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0806" stop-opacity="0"/>
    </radialGradient>

    <!-- Off-axis pressure -->
    <radialGradient id="fg2" cx="80%" cy="10%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#481e08" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0806" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground plate: dark below -->
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="40%"  stop-color="#0a0806" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0806" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Edge vignette -->
    <radialGradient id="vg" cx="50%" cy="50%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0a0806" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0806" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Wordmark glow -->
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

  </defs>

  <!-- Base -->
  <rect width="1280" height="400" fill="#0a0806"/>

  <!-- Primary kinetic mass -->
  <rect x="-5%" y="-5%" width="110%" height="78%" fill="#301708" filter="url(#kb)" opacity="0.85">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; -12,16; 7,-8; 0,0"
      dur="24s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>

  <!-- Second kinetic layer -->
  <rect x="-5%" y="-5%" width="110%" height="65%" fill="#3d1d0a" filter="url(#kb2)" opacity="0.40">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 14,-10; -6,7; 0,0"
      dur="19s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>

  <!-- Force gradients -->
  <rect width="1280" height="400" fill="url(#fg)"/>
  <rect width="1280" height="400" fill="url(#fg2)"/>
  <rect width="1280" height="400" fill="url(#gd)"/>
  <rect width="1280" height="400" fill="url(#vg)"/>

  <!-- Wordmark glow layer (render beneath) -->
  <text
    x="80" y="318"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="108"
    font-weight="bold"
    fill="#9b1f1f"
    opacity="0.25"
    filter="url(#glow)"
    letter-spacing="-3">sirocco.gallery</text>

  <!-- Wordmark -->
  <text
    x="80" y="318"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="108"
    font-weight="bold"
    letter-spacing="-3">
    <tspan fill="#b59271">sirocco</tspan><tspan fill="#e7e5cb">.gallery</tspan>
  </text>

  <!-- Rule -->
  <line x1="80" y1="340" x2="520" y2="340" stroke="#6b1414" stroke-width="0.6" opacity="0.65"/>

  <!-- Sub -->
  <text
    x="80" y="370"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13"
    font-style="italic"
    fill="#e7e5cb"
    letter-spacing="6"
    opacity="0.85">autunno 2026</text>

</svg>
